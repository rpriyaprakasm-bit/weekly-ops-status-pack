name: Weekly Ops Status Pack

on:
  schedule:
    - cron: "0 14 * * 5"

  workflow_dispatch:
    inputs:
      input_source:
        description: "excel (CSV/XLSX) | jira | excel+jira"
        required: true
        default: "excel"
        type: choice
        options:
          - excel
          - jira
          - excel+jira

  repository_dispatch:
    types: [weekly-ops-status]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  status-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai openpyxl

      - name: Resolve input source
        id: src
        run: |
          SRC="${{ github.event.inputs.input_source }}"
          if [ -z "$SRC" ] || [ "$SRC" = "" ]; then
            SRC="${{ github.event.client_payload.input_source }}"
          fi
          if [ -z "$SRC" ] || [ "$SRC" = "" ]; then
            SRC="excel"
          fi
          echo "input_source=$SRC" >> "$GITHUB_OUTPUT"
          echo "Using INPUT_SOURCE=$SRC"

      - name: Collect inputs (Excel / CSV / Jira)
        env:
          INPUT_SOURCE: ${{ steps.src.outputs.input_source }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python -m src.collectors.run_collect

      - name: Build status pack with Grok
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python -m src.analyzers.status_pack_grok

      - name: Publish to docs + record history
        run: python -m src.reporters.publish_status

      - name: Notify Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python -m src.reporters.notify_teams

      - name: Commit updated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/workstream_updates.json data/status_pack.json data/status_pack.md data/history.json \
            docs/status_pack.json docs/status_pack.md docs/history.json || true
          git diff --staged --quiet || git commit -m "chore: weekly status pack $(date -u +%Y-%m-%d)"
          git push || true
